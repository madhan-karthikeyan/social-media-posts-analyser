version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sma_backend
    ports:
      - "8000:8000"
    environment:
      # This will pull from the .env file in the root directory
      - GROQ_API_KEY=${GROQ_API_KEY}
      - OCR_KEY=${OCR_KEY}
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Since the frontend runs in the user's browser, it must point to the public address of the backend.
        # For local Docker testing, localhost:8000 routes perfectly to the mapped port above.
        - VITE_API_URL=http://localhost:8000/api
    container_name: sma_frontend
    ports:
      # Map to 5173 to keep it familiar with standard Vite development ports
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
